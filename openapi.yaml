openapi: 3.0.3
info:
  title: Firstdose
  version: 0.1.0
  description: >-
    Multi-party case system for manufacturer-sponsored specialty patient support. Every
    barrier between prescription and sustained therapy becomes a typed work item with an
    owner and a clock, routed across hub, specialty pharmacy, payer, prescriber office and
    nurse educator through a structured service exchange. Patient authorisation is
    re-evaluated at every external exchange, adverse-event capture blocks contact closure,
    and only aggregate segment views cross the commercial firewall.
  x-product-slug: ai-health-firstdose
  x-source: ai-in-health/Accenture-Intelligent-Patient-Platform-Video-Transcript/
servers:
  - url: https://api.example.com
tags:
  - name: Cases
    description: Patient case enrolment, status, and target first-dose date
  - name: Authorisation
    description: Scoped, revocable patient authorisation evaluated per exchange
  - name: Barriers
    description: Typed blockers with owners, clocks, and recorded resolutions
  - name: Exchange
    description: Structured work routing to and from external parties
  - name: Access
    description: Benefits verification, prior authorisation, appeals, and assistance
  - name: Initiation
    description: REMS prerequisites, specialty pharmacy triage, shipment, and training
  - name: Adherence
    description: Refill lapse, missed dose, and dosing gap operations
  - name: Safety
    description: Adverse event capture, routing clocks, and contact closure control
  - name: Boundaries
    description: Non-clinical scope escalation and commercial firewall events
  - name: Outcomes
    description: De-identified population cohorts under data-use agreements
  - name: Reporting
    description: Time to first dose, persistence, abandonment, and cost to serve
paths:
  /v1/cases:
    get:
      operationId: listPatientCases
      summary: List patient cases by stage, payer, or abandonment risk
      tags: [Cases]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: stage
          in: query
          schema:
            type: string
            enum:
              [
                enrolled,
                benefits_pending,
                coverage_pending,
                assistance_pending,
                initiation_pending,
                on_therapy,
                lapsed,
                abandoned,
                discontinued,
              ]
        - name: payerId
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [abandonment_risk, days_since_enrolment, target_first_dose_date]
            default: abandonment_risk
      responses:
        "200":
          description: Patient cases page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePatientCase"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: enrolPatientCase
      summary: Enrol a patient and open a case with a target first-dose date
      tags: [Cases]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientCaseCreate"
      responses:
        "201":
          description: Case opened, pending authorisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePatientCase"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getPatientCase
      summary: Get a case with open barriers and elapsed clocks
      tags: [Cases]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Patient case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePatientCase"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/cases/{caseId}/authorisation:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getAuthorisation
      summary: Get the patient authorisation scope currently in force
      tags: [Authorisation]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Authorisation in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAuthorisation"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: setAuthorisation
      summary: Capture or amend a scoped, evidenced patient authorisation
      tags: [Authorisation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorisationUpsert"
      responses:
        "200":
          description: Authorisation recorded as a new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAuthorisation"
  /v1/cases/{caseId}/authorisation/revocation:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: revokeAuthorisation
      summary: Revoke authorisation and halt sharing without severing therapy support
      tags: [Authorisation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revokedBy]
              properties:
                revokedBy:
                  type: string
                  enum: [patient, caregiver, legal_representative]
                scopesRevoked:
                  type: array
                  items:
                    type: string
                continueTherapySupport:
                  type: boolean
                  default: true
                statedReason:
                  type: string
      responses:
        "202":
          description: Revocation applied and external exchanges halted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAuthorisation"
  /v1/barriers:
    get:
      operationId: listBarriers
      summary: List open barriers by type, owning party, and clock state
      tags: [Barriers]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: caseId
          in: query
          schema:
            type: string
        - name: barrierType
          in: query
          schema:
            $ref: "#/components/schemas/BarrierType"
        - name: ownerPartyType
          in: query
          schema:
            $ref: "#/components/schemas/PartyType"
        - name: overdueOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Barriers page ordered by abandonment contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeBarrier"
  /v1/barriers/{barrierId}/assignment:
    parameters:
      - $ref: "#/components/parameters/BarrierId"
    post:
      operationId: assignBarrierOwner
      summary: Assign a barrier to the party that can clear it, with its clock
      tags: [Barriers]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerPartyType, ownerPartyId]
              properties:
                ownerPartyType:
                  $ref: "#/components/schemas/PartyType"
                ownerPartyId:
                  type: string
                dueAt:
                  type: string
                  format: date-time
                clockSource:
                  type: string
                  enum:
                    [
                      payer_turnaround_rule,
                      clinical_window,
                      vendor_sla,
                      statutory_deadline,
                      programme_target,
                    ]
      responses:
        "200":
          description: Barrier assigned with clock started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBarrier"
  /v1/barriers/{barrierId}/resolution:
    parameters:
      - $ref: "#/components/parameters/BarrierId"
    post:
      operationId: resolveBarrier
      summary: Record the resolution of a barrier and recompute case stage
      tags: [Barriers]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [cleared, cleared_with_workaround, superseded, unresolvable]
                resolutionNote:
                  type: string
                resolvedBy:
                  type: string
      responses:
        "200":
          description: Barrier resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBarrier"
  /v1/exchange/partners:
    get:
      operationId: listExchangePartners
      summary: List external parties and the channels each supports
      tags: [Exchange]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: partyType
          in: query
          schema:
            $ref: "#/components/schemas/PartyType"
      responses:
        "200":
          description: Exchange partners page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeExchangePartner"
  /v1/exchange/work-items:
    post:
      operationId: dispatchWorkItem
      summary: Dispatch a work item to an external party in a channel they support
      tags: [Exchange]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemCreate"
      responses:
        "201":
          description: Work item dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorkItem"
        "403":
          description: Authorisation scope does not permit disclosure to this party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/exchange/work-items/{workItemId}/return:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
    post:
      operationId: returnWorkItem
      summary: Return a completed or blocked work item from an external party
      tags: [Exchange]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [completed, blocked, rejected, needs_information]
                missingFields:
                  type: array
                  items:
                    type: string
                  description: Names the exact field so triage does not loop by fax
                payload:
                  type: object
                  additionalProperties: true
                returnedBy:
                  type: string
      responses:
        "200":
          description: Work item returned and barrier state recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeWorkItem"
        "403":
          description: Authorisation revoked since dispatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/cases/{caseId}/benefits-verification:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: recordBenefitsVerification
      summary: Record benefit design, coverage pathway, and patient responsibility
      tags: [Access]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitsVerificationCreate"
      responses:
        "201":
          description: Verification recorded and downstream barriers derived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBenefitsVerification"
  /v1/cases/{caseId}/prior-authorisations:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: submitPriorAuthorisation
      summary: Submit a prior authorisation against the payer's published criteria
      tags: [Access]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriorAuthorisationCreate"
      responses:
        "201":
          description: Prior authorisation submitted with payer turnaround clock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePriorAuthorisation"
  /v1/prior-authorisations/{priorAuthId}/appeal:
    parameters:
      - $ref: "#/components/parameters/PriorAuthId"
    post:
      operationId: fileAppeal
      summary: File an appeal with denial reason and payer criteria attached
      tags: [Access]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealCreate"
      responses:
        "201":
          description: Appeal filed with its statutory window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAppeal"
        "409":
          description: Appeal window already closed for this denial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/cases/{caseId}/assistance-eligibility:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: determineAssistanceEligibility
      summary: Determine financial assistance eligibility by published rule
      description: >-
        Government-insured patients are excluded by rule where required. Any override
        must carry a logged, approved exception rather than agent discretion.
      tags: [Access]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistanceEligibilityRequest"
      responses:
        "201":
          description: Eligibility determined with the rule version applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAssistanceEligibility"
        "409":
          description: Patient excluded by rule and no approved exception supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/cases/{caseId}/rems-enrolment:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: recordRemsEnrolment
      summary: Record REMS and certification prerequisites before dispensing
      tags: [Initiation]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemsEnrolmentCreate"
      responses:
        "201":
          description: REMS state recorded and dispensing gate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRemsEnrolment"
  /v1/cases/{caseId}/triage:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: recordSpecialtyPharmacyTriage
      summary: Record specialty pharmacy triage state and any precisely named blocker
      tags: [Initiation]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialtyPharmacyTriageCreate"
      responses:
        "201":
          description: Triage recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSpecialtyPharmacyTriage"
        "409":
          description: REMS or certification prerequisite outstanding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/cases/{caseId}/shipments:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: recordShipment
      summary: Record a therapy shipment and its delivery state
      tags: [Initiation]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentCreate"
      responses:
        "201":
          description: Shipment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeShipment"
  /v1/cases/{caseId}/training-visits:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: scheduleTrainingVisit
      summary: Schedule a nurse educator injection or administration training visit
      tags: [Initiation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingVisitCreate"
      responses:
        "201":
          description: Visit scheduled inside the documented non-clinical scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTrainingVisit"
  /v1/cases/{caseId}/first-dose:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: recordFirstDose
      summary: Record first dose and stop the time-to-therapy clock
      tags: [Initiation]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [administeredAt, source]
              properties:
                administeredAt:
                  type: string
                  format: date-time
                source:
                  type: string
                  enum: [specialty_pharmacy_dispense, patient_reported, device_telemetry, nurse_educator]
      responses:
        "200":
          description: First dose recorded, case moved to on-therapy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePatientCase"
  /v1/adherence-events:
    get:
      operationId: listAdherenceEvents
      summary: List refill lapses, missed doses, and dosing gaps as clocked items
      tags: [Adherence]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: caseId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
            enum: [refill_lapse, missed_dose, dosing_gap, device_inactive, discontinuation_signal]
      responses:
        "200":
          description: Adherence events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAdherenceEvent"
    post:
      operationId: reportAdherenceEvent
      summary: Report an adherence event from dispense data, device, or patient report
      tags: [Adherence]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdherenceEventCreate"
      responses:
        "201":
          description: Event recorded and a clocked work item raised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAdherenceEvent"
  /v1/cases/{caseId}/contacts:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: recordPatientContact
      summary: Open a patient or caregiver contact with its outstanding duties
      tags: [Safety]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientContactCreate"
      responses:
        "201":
          description: Contact opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePatientContact"
  /v1/contacts/{contactId}/close:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    post:
      operationId: closePatientContact
      summary: Close a contact once adverse-event routing is confirmed
      tags: [Safety]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adverseEventMentioned]
              properties:
                adverseEventMentioned:
                  type: boolean
                productComplaintMentioned:
                  type: boolean
                summary:
                  type: string
      responses:
        "200":
          description: Contact closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePatientContact"
        "409":
          description: Adverse event captured but routing to safety unconfirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/safety/adverse-event-reports:
    post:
      operationId: captureAdverseEventReport
      summary: Capture an adverse event or product complaint and start the routing clock
      tags: [Safety]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdverseEventReportCreate"
      responses:
        "201":
          description: Report captured with a 24-hour clock on serious cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAdverseEventReport"
  /v1/scope-escalations:
    post:
      operationId: escalateOutOfScopeRequest
      summary: Refuse an out-of-scope clinical request and route it to the prescriber
      tags: [Boundaries]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopeEscalationCreate"
      responses:
        "201":
          description: Request refused by programme staff and escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeScopeEscalation"
  /v1/boundaries/firewall-events:
    get:
      operationId: listFirewallEvents
      summary: List blocked commercial access attempts to patient-level data
      tags: [Boundaries]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: requesterRole
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Firewall events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeFirewallEvent"
  /v1/outcomes/cohorts:
    get:
      operationId: listPopulationOutcomeCohorts
      summary: List de-identified population cohorts shared with payer partners
      tags: [Outcomes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: payerPartnerId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Population outcome cohorts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePopulationOutcomeCohort"
    post:
      operationId: publishPopulationOutcomeCohort
      summary: Publish a de-identified cohort outcome under an active data-use agreement
      tags: [Outcomes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationOutcomeCohortCreate"
      responses:
        "201":
          description: Cohort published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePopulationOutcomeCohort"
        "409":
          description: No active data-use agreement, or cohort below re-identification threshold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/reports/programme-performance:
    get:
      operationId: getProgrammePerformance
      summary: Get time to first dose, persistence, abandonment, and cost to serve
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            example: 2026-Q3
        - name: payerId
          in: query
          schema:
            type: string
        - name: barrierType
          in: query
          schema:
            $ref: "#/components/schemas/BarrierType"
      responses:
        "200":
          description: Programme performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeProgrammePerformanceMetric"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    BarrierId:
      name: barrierId
      in: path
      required: true
      schema:
        type: string
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
    PriorAuthId:
      name: priorAuthId
      in: path
      required: true
      schema:
        type: string
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
